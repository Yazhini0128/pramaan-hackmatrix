<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pramaan — Digital Evidence Readiness Platform</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="pre-auth">

<div id="splash">
  <div class="grid-bg"></div>
  <div class="scanline"></div>
  <svg class="splash-mark" viewBox="0 0 84 84" fill="none">
    <polygon points="42,3 78,22 78,58 42,81 6,58 6,22" stroke="#2DD9C3" stroke-width="2" fill="rgba(45,217,195,.05)"/>
    <path d="M42 20 a20 20 0 0 1 0 40" stroke="#E8A93A" stroke-width="2" fill="none" opacity=".8"/>
    <path d="M42 28 a12 12 0 0 1 0 24" stroke="#2DD9C3" stroke-width="2" fill="none"/>
    <path d="M32 42 l7 7 13 -15" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>
  <div class="splash-word">PRAMAAN</div>
  <div class="splash-tag">Digital Evidence Readiness Platform</div>
  <div class="splash-bar"><div class="splash-bar-fill" id="splashFill"></div></div>
  <div class="splash-status" id="splashStatus">Initializing secure evidence engine…</div>
</div>

<div id="loginGate">
  <canvas id="matrixCanvas"></canvas>
  <div class="lg-scanline"></div>
  <div class="lg-vignette"></div>
  <div class="login-card">
    <div class="login-badge">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2DD9C3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/><path d="M9 12l2 2 4-4"/></svg>
    </div>
    <div class="login-title">Secure Access Terminal</div>
    <div class="login-sub">Authenticate to enter the evidence platform</div>

    <label class="login-field-label">Police Unit / Agency</label>
    <select id="loginUnit" style="margin-bottom:14px;"></select>

    <label class="login-field-label">Access Code</label>
    <input id="loginPass" type="password" placeholder="•••••••••" value="pramaan-demo" style="margin-bottom:4px;">

    <button class="btn teal" id="loginBtn" style="width:100%;justify-content:center;margin-top:14px;" onclick="attemptLogin()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Authenticate
    </button>
    <div class="login-bar"><div class="login-bar-fill" id="loginBarFill"></div></div>
    <div class="scan-status" id="loginStatus"></div>
  </div>
</div>

<header>

  <div class="brand" onclick="goto('dashboard')">
    <svg width="34" height="34" viewBox="0 0 84 84" fill="none">
      <polygon points="42,3 78,22 78,58 42,81 6,58 6,22" stroke="#2DD9C3" stroke-width="3" fill="rgba(45,217,195,.06)"/>
      <path d="M42 20 a20 20 0 0 1 0 40" stroke="#E8A93A" stroke-width="3" fill="none" opacity=".85"/>
      <path d="M42 28 a12 12 0 0 1 0 24" stroke="#2DD9C3" stroke-width="3" fill="none"/>
      <path d="M32 42 l7 7 13 -15" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <div><h1>PRAMAAN</h1><span>From Collection to Court — Every Byte Verified</span></div>
  </div>
  <nav id="navButtons">
    <select id="unitScope" onchange="setActiveUnit(this.value)" title="Switch which police unit's cases you're viewing" style="width:auto;margin:0;padding:8px 12px;font-size:12.5px;"></select>
    <button onclick="goto('dashboard')">Dashboard</button>
    <button onclick="exportAllData()" title="Download a backup of all cases and evidence">Backup</button>
    <button onclick="document.getElementById('importInput').click()" title="Restore from a backup file">Restore</button>
    <input type="file" id="importInput" accept="application/json" style="display:none" onchange="importAllData(event)">
    <button class="primary" onclick="goto('newcase')">New Case</button>
    <button onclick="logOut()" title="Log out and return to the access terminal">Log Out</button>
  </nav>
</header>

<main id="app"></main>
<footer>PRAMAAN · Digital Evidence Readiness Platform · Runs fully offline · No cloud dependency</footer>
<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
